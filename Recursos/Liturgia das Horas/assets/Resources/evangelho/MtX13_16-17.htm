Naquele tempo, disse Jesus a seus discípulos: <span class="num-vermelho versiculo-dois-algarismos">16</span>"Felizes sois vós, porque vossos olhos veem e vossos ouvidos ouvem. <span class="num-vermelho versiculo-dois-algarismos">17</span>Em verdade vos digo, muitos profetas e justos desejavam ver o que vedes, e não viram, desejavam ouvir o que ouvis, e não ouviram".
